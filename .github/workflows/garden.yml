# jev-garden CI — the idle-compile lane: the fleet's battery on GitHub's compute.
# Dispatched by wave-50 lane 50-c after the codespace ssh path proved blocked
# (no ssh binary, no sudo — receipted). Determinism crown: the twin comparison
# must be byte-identical in the cloud too.
name: garden-battery
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: selftest (fail-closed seals + QTHE facts + tamper localization)
        run: node tests/selftest.mjs
      - name: smoke (one tiny garden end to end)
        run: node smoke.mjs
      - name: bake-off on real qcells soil (needs the sister repo)
        run: |
          git clone -q --depth 1 https://github.com/SuperInstance/quilt-qcells.git ../quilt-qcells
          node experiments/e_g1_grow.mjs
          node experiments/e_g1b_addendum.mjs
          node experiments/e_g2c_growth.mjs
      - name: cross-substrate determinism (JS == Python twin)
        run: node experiments/e_g5_determinism.mjs
      - name: publish receipts
        uses: actions/upload-artifact@v4
        with: { name: garden-receipts, path: receipts/ }
